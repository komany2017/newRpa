<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>RPA Picker Test Page</title>
  <style>
    body { font: 14px/1.6 "Microsoft YaHei", sans-serif; margin: 24px; color: #1f2329; }
    h1 { font-size: 20px; }
    section { margin: 16px 0; padding: 12px; border: 1px solid #e5e6eb; border-radius: 8px; }
    button, input { padding: 6px 12px; margin-right: 8px; }
    .tag { color: #86909c; font-size: 12px; }
    iframe { width: 100%; height: 90px; border: 1px dashed #c9cdd4; }
  </style>
</head>
<body>
  <h1>RPA 元素选择器 · 联调测试页</h1>
  <p class="tag">用于验证稳定选择器、动态 id、iframe、Shadow DOM 与动作回放。</p>

  <section>
    <h3>稳定元素</h3>
    <button id="loginBtn" data-testid="login" class="primary-button">登录</button>
    <button id="dynamicBtn" data-testid="dynamic-target" class="css-1x2y3z active">动态 class 元素</button>
    <button id="ember9931" data-testid="volatile-id" class="btn">框架生成 id</button>
    <p>点击次数：<span id="clickCount">0</span></p>
  </section>

  <section>
    <h3>表单</h3>
    <input id="username" name="username" type="text" placeholder="请输入账号" value="">
    <span class="tag">name / type / placeholder 候选</span>
  </section>

  <section>
    <h3>iframe</h3>
    <iframe id="childFrame" src="frame.html" title="child frame"></iframe>
  </section>

  <section>
    <h3>Shadow DOM</h3>
    <div id="shadowHost"></div>
  </section>

  <script>
    var count = 0;
    document.getElementById('loginBtn').addEventListener('click', function () {
      count += 1;
      document.getElementById('clickCount').textContent = String(count);
    });
    var root = document.getElementById('shadowHost').attachShadow({ mode: 'open' });
    root.innerHTML = '<button id="shadowBtn">Shadow 按钮</button>';
  </script>
</body>
</html>
